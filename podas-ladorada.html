<p>La app <b>Podas La Dorada</b> ahora está en <a href="ladorada/">mantenimiento01.github.io/ladorada/</a>. Sus registros siguen guardados.</p>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { const p = new URL(r.scope).pathname; if (p === '/' || p.startsWith('/podas-')) r.unregister(); })).catch(() => {});
location.replace('ladorada/');
</script>
